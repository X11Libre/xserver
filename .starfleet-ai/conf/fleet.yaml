# Fleet identity configuration
#
# Controls the flagship identity and the worker ship-name pool.
# The flagship name is the canonical control-agent identity that all
# worker ships report to. Ship names are drawn from the pool below
# (or compiled-in defaults when this file is absent).

fleet:
  # Name of the flagship session (default: "Enterprise").
  flagship: "Enterprise"

  # Ship-name pool for worker sessions (one per line).
  # Order matters: the first unused name is assigned.
  # When absent, the compiled-in Star Trek ship roster is used.
  # The flagship name is always excluded from this pool.
  # ship_names:
  #   - Defiant
  #   - Voyager
  #   - Discovery

#  provider_mode: "model-proxy-only"

# Direct providers — bypass the local model proxy entirely, connecting
# straight to the upstream API. Used exceptionally (proxy down, ZEN quota
# exhausted). These are merged with proxied providers for ship opencode
# config generation and the web frontend model list.
direct_providers:
  - id: nvidia-direct
    name: "NVIDIA NIM (direct)"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: "{env:NIM_API_KEY}"
    type: "nim-proxy"
    model_filter: "free-only"
    capabilities: ["toolcall", "temperature"]
    user_agent: ""
    max_retries: 3
    retry_delay_ms: 1000
    hold_timeout_ms: 15000
    health_interval: "5m"
    health_timeout: "10s"
    health_endpoint: "/health"

  - id: ollama
    name: "Ollama (local)"
    type: ollama
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model_filter: "all"
    capabilities: ["toolcall", "temperature"]
    user_agent: ""
    max_retries: 3
    retry_delay_ms: 1000
    hold_timeout_ms: 15000
    health_interval: "5m"
    health_timeout: "10s"
    health_endpoint: "/api/version"
