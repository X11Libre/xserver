# Model proxy — local OpenAI-compatible endpoint in front of the real model
# API backends (NVIDIA NIM, OpenCode Zen, ...). Ships talk to this single
# local endpoint; the proxy retries transient upstream errors and catches
# streaming failures so a model-API hiccup never leaks raw into the session.
#
# The proxy's provider entries are injected into every generated per-ship
# opencode config as opencode providers named by their `id` (here
# nim-proxy/zen-proxy). Model catalogs are queried automatically from the
# upstream /models endpoint — no manual model list needed.
#
# listen_addr is bound to localhost only: the proxy holds the real API keys
# and is only ever used by local opencode processes.
model_proxy:
  listen_addr: "127.0.0.1:8443"

  # Each provider: id (opencode provider name), name (label), base_url
  # (OpenAI-compatible upstream), api_key (env-referenced — the proxy keeps
  # the real key, ships never see it), optional retry tuning.
  # When `direct: true`, the provider is exposed directly to ships (bypassing
  # the local proxy) using the upstream's actual BaseURL and APIKey.
  providers:
    - id: nim-proxy
      name: "NVIDIA NIM (local proxy)"
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key: "{env:NIM_API_KEY}"

    - id: zen-proxy
      name: "OpenCode Zen (local proxy)"
      type: opencode-zen
      base_url: "https://opencode.ai/zen/v1"
      api_key: "{env:OPENCODE_API_KEY}"
      # OpenCode Zen's free tier only accepts requests that look like the
      # official opencode client, and now requires the x-opencode-* identity
      # headers on top of the User-Agent. The "opencode-zen" type makes the
      # proxy forward the client's real session id (opencode sends it as
      # X-Session-Id; forwarded verbatim so Zen's per-session prefix cache
      # stays warm) and stamps the missing identity headers.

    - id: nvidia-direct
      name: "NVIDIA NIM (direct)"
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key: "{env:NIM_API_KEY}"
      direct: true

    - id: ollama
      name: "Ollama (local)"
      type: ollama
      base_url: "http://localhost:11434/v1"
      # Ollama doesn't require API keys, but we need to provide something
      # to satisfy the OpenAI-compatible interface. The value doesn't matter
      # as Ollama ignores it.
      api_key: "ollama"
      # Ollama's /v1/models catalog carries no capability metadata, so the
      # generated per-ship opencode.json would treat its models as tool-less.
      # The "ollama" type force-enables the caps virtually all Ollama models
      # support (tool calling + temperature) on every model entry; tune the
      # exact set here if needed (e.g. "attachment" for vision models).

    - id: meta-model
      name: "Meta-Model Strategies"
      type: meta-model
      # Virtual provider: no upstream, no base_url. Its catalog is synthesized
      # from the strategies below — one model endpoint per strategy, named by
      # the strategy ID (e.g. "heavy-model"). Chat requests addressing such a
      # virtual model are routed through the strategy's picking logic onto the
      # real upstream models; direct requests for real model ids bypass the
      # strategy layer entirely.

  # Meta-model routing strategies — own curated models on zen-proxy only.
  # NEVER reference normal models (nim-proxy) here: the whole point is that
  # meta-model routing is decoupled from the normal model pool, so NIM
  # outages don't cascade into the strategy layer.
  strategies:
    - id: heavy-model
      description: "Komplexe Aufgaben — BigPickle, Fallback Nemotron Ultra Free"
      default_model: "big-pickle"
      models:
        - id: "big-pickle"
          provider: "zen-proxy"
          context_window: 200000
          priority: 1
        - id: "nemotron-3-ultra-free"
          provider: "zen-proxy"
          context_window: 1000000
          priority: 2
      strategy: "fallback"
      # Effective limit: min(200000, 1000000) = 200000

    - id: cruiser-model
      description: "Allgemeine Arbeit — Round-Robin für Verfügbarkeit"
      models:
        - id: "nemotron-3-ultra-free"
          provider: "zen-proxy"
          context_window: 1000000
          weight: 1
        - id: "nemotron-3.5-lightning-free"
          provider: "zen-proxy"
          context_window: 262144
          weight: 1
      strategy: "round-robin"
      # Effective limit: min(1000000, 262144) = 262144

    - id: scout-model
      description: "Leichte Aufgaben — schnell, billig"
      models:
        - id: "nemotron-3.5-lightning-free"
          provider: "zen-proxy"
          context_window: 262144
      strategy: "single"
      # Effective limit: 262144

    - id: balanced-model
      description: "60% BigPickle, 40% Nemotron Ultra Free"
      models:
        - id: "big-pickle"
          provider: "zen-proxy"
          context_window: 200000
          weight: 3
        - id: "nemotron-3-ultra-free"
          provider: "zen-proxy"
          context_window: 1000000
          weight: 2
      strategy: "weighted"
      # Effective limit: min(200000, 1000000) = 200000