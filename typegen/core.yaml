# structure definition for reply structs
# field order follows X11/Xproto.h; explicit pad fields reproduce the
# reference wire layout exactly (auto-padding is only a fallback)
reply-struct:
    GenericReply:
        payload:
            data00: CARD32
            data01: CARD32
            data02: CARD32
            data03: CARD32
            data04: CARD32
            data05: CARD32
    GetWindowAttributes:
        data-name: backingStore
        payload:
            visualID:           VISUAL
            class:              CARD16
            bitGravity:         CARD8
            winGravity:         CARD8
            backingBitPlanes:   CARD32
            backingPixel:       CARD32
            saveUnder:          BOOL
            mapInstalled:       BOOL
            mapState:           CARD8
            override:           BOOL
            colormap:           COLORMAP
            allEventMasks:      CARD32
            yourEventMask:      CARD32
            doNotPropagateMask: CARD16
            pad:                CARD16
    GetGeometry:
        data-name: depth
        payload:
            root:       WINDOW
            x:          INT16
            y:          INT16
            width:      CARD16
            height:     CARD16
            borderWith: CARD16
            pad1:       CARD16
            pad2:       CARD32
            pad3:       CARD32
    QueryTree:
        payload:
            root:      WINDOW
            parent:    WINDOW
            nChildren: CARD16
            pad2:      CARD16
            pad3:      CARD32
            pad4:      CARD32
            pad5:      CARD32
    InternAtom:
        payload:
            atom: ATOM
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
    GetAtomName:
        payload:
            nameLength: CARD16
            pad2:       CARD16
            pad3:       CARD32
            pad4:       CARD32
            pad5:       CARD32
            pad6:       CARD32
            pad7:       CARD32
    GetProperty:
        payload:
            propertyType: ATOM
            bytesAfter:   CARD32
            nItems:       CARD32
            pad1:         CARD32
            pad2:         CARD32
            pad3:         CARD32
    ListProperties:
        payload:
            nProperties: CARD16
            pad2:        CARD16
            pad3:        CARD32
            pad4:        CARD32
            pad5:        CARD32
            pad6:        CARD32
            pad7:        CARD32
    GetSelectionOwner:
        payload:
            owner: WINDOW
            pad2:  CARD32
            pad3:  CARD32
            pad4:  CARD32
            pad5:  CARD32
            pad6:  CARD32
    GrabPointer:
        data-name: status
        payload:
            pad1: CARD32
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
    GrabKeyboardReply:
        data-name: status
        payload:
            pad1: CARD32
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
    QueryPointer:
        data-name: sameScreen
        data-type: BOOL
        payload:
            root:  WINDOW
            child: WINDOW
            rootX: INT16
            rootY: INT16
            winX:  INT16
            winY:  INT16
            mask:  CARD16
            pad1:  CARD16
            pad:   CARD32
    GetMotionEvents:
        payload:
            nEvents: CARD32
            pad2:    CARD32
            pad3:    CARD32
            pad4:    CARD32
            pad5:    CARD32
            pad6:    CARD32
    TranslateCoords:
        data-name: sameScreen
        data-type: BOOL
        payload:
            child: WINDOW
            dstX:  INT16
            dstY:  INT16
            pad2:  CARD32
            pad3:  CARD32
            pad4:  CARD32
            pad5:  CARD32
    GetInputFocus:
        data-name: revertTo
        payload:
            focus: WINDOW
            pad1:  CARD32
            pad2:  CARD32
            pad3:  CARD32
            pad4:  CARD32
            pad5:  CARD32
    QueryKeymap:
        payload:
            map: BYTE_ARRAY_32
    QueryFont:
        payload:
            minBounds:      CHAR_INFO
            walign1:        CARD32
            maxBounds:      CHAR_INFO
            walign2:        CARD32
            minCharOrByte2: CARD16
            maxCharOrByte2: CARD16
            defaultChar:    CARD16
            nFontProps:     CARD16
            drawDirection:  CARD8
            minByte1:       CARD8
            maxByte1:       CARD8
            allCharsExist:  BOOL
            fontAscent:     INT16
            fontDescent:    INT16
            nCharInfos:     CARD32
    QueryTextExtents:
        data-name: drawDirection
        payload:
            fontAscent:      INT16
            fontDescent:     INT16
            overallAscent:   INT16
            overallDescent:  INT16
            overallWidth:    INT32
            overallLeft:     INT32
            overallRight:    INT32
            pad:             CARD32
    ListFonts:
        payload:
            nFonts: CARD16
            pad2:   CARD16
            pad3:   CARD32
            pad4:   CARD32
            pad5:   CARD32
            pad6:   CARD32
            pad7:   CARD32
    ListFontsWithInfo:
        data-name: nameLength
        payload:
            minBounds:      CHAR_INFO
            walign1:        CARD32
            maxBounds:      CHAR_INFO
            walign2:        CARD32
            minCharOrByte2: CARD16
            maxCharOrByte2: CARD16
            defaultChar:    CARD16
            nFontProps:     CARD16
            drawDirection:  CARD8
            minByte1:       CARD8
            maxByte1:       CARD8
            allCharsExist:  BOOL
            fontAscent:     INT16
            fontDescent:    INT16
            nReplies:       CARD32
    GetFontPath:
        payload:
            nPaths: CARD16
            pad2:   CARD16
            pad3:   CARD32
            pad4:   CARD32
            pad5:   CARD32
            pad6:   CARD32
            pad7:   CARD32
    GetImage:
        data-name: depth
        payload:
            visual: VISUAL
            pad3:   CARD32
            pad4:   CARD32
            pad5:   CARD32
            pad6:   CARD32
            pad7:   CARD32
    ListInstalledColormaps:
        payload:
            nColormaps: CARD16
            pad2:       CARD16
            pad3:       CARD32
            pad4:       CARD32
            pad5:       CARD32
            pad6:       CARD32
            pad7:       CARD32
    AllocColor:
        payload:
            red:   CARD16
            green: CARD16
            blue:  CARD16
            pad2:  CARD16
            pixel: CARD32
            pad3:  CARD32
            pad4:  CARD32
            pad5:  CARD32
    AllocNamedColor:
        payload:
            pixel:         CARD32
            exactRed:      CARD16
            exactGreen:    CARD16
            exactBlue:     CARD16
            screenRed:     CARD16
            screenGreen:   CARD16
            screenBlue:    CARD16
            pad2:          CARD32
            pad3:          CARD32
    AllocColorCells:
        payload:
            nPixels: CARD16
            nMasks:  CARD16
            pad3:    CARD32
            pad4:    CARD32
            pad5:    CARD32
            pad6:    CARD32
            pad7:    CARD32
    AllocColorPlanes:
        payload:
            nPixels:    CARD16
            pad2:       CARD16
            redMask:    CARD32
            greenMask:  CARD32
            blueMask:   CARD32
            pad3:       CARD32
            pad4:       CARD32
    QueryColors:
        payload:
            nColors: CARD16
            pad2:    CARD16
            pad3:    CARD32
            pad4:    CARD32
            pad5:    CARD32
            pad6:    CARD32
            pad7:    CARD32
    LookupColor:
        payload:
            exactRed:    CARD16
            exactGreen:  CARD16
            exactBlue:   CARD16
            screenRed:   CARD16
            screenGreen: CARD16
            screenBlue:  CARD16
            pad3:        CARD32
            pad4:        CARD32
            pad5:        CARD32
    QueryBestSize:
        payload:
            width:  CARD16
            height: CARD16
            pad3:   CARD32
            pad4:   CARD32
            pad5:   CARD32
            pad6:   CARD32
            pad7:   CARD32
    QueryExtension:
        payload:
            present:      BOOL
            major_opcode: CARD8
            first_event:  CARD8
            first_error:  CARD8
            pad3:         CARD32
            pad4:         CARD32
            pad5:         CARD32
            pad6:         CARD32
            pad7:         CARD32
    ListExtensions:
        data-name: nExtensions
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    SetMapping:
        data-name: success
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    SetPointerMapping:
        data-name: success
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    SetModifierMapping:
        data-name: success
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    GetPointerMapping:
        data-name: nElts
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    GetKeyboardMapping:
        data-name: keySymsPerKeyCode
        payload:
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
            pad7: CARD32
    GetModifierMapping:
        data-name: numKeyPerModifier
        payload:
            pad1: CARD32
            pad2: CARD32
            pad3: CARD32
            pad4: CARD32
            pad5: CARD32
            pad6: CARD32
    GetKeyboardControl:
        data-name: globalAutoRepeat
        data-type: BOOL
        payload:
            ledMask:        CARD32
            keyClickPercent: CARD8
            bellPercent:    CARD8
            bellPitch:      CARD16
            bellDuration:   CARD16
            pad:            CARD16
            map:            BYTE_ARRAY_32
    GetPointerControl:
        payload:
            accelNumerator:   CARD16
            accelDenominator: CARD16
            threshold:        CARD16
            pad2:             CARD16
            pad3:             CARD32
            pad4:             CARD32
            pad5:             CARD32
            pad6:             CARD32
    GetScreenSaver:
        payload:
            timeout:         CARD16
            interval:        CARD16
            preferBlanking:  BOOL
            allowExposures:  BOOL
            pad2:            CARD16
            pad3:            CARD32
            pad4:            CARD32
            pad5:            CARD32
            pad6:            CARD32
    ListHosts:
        data-name: enabled
        data-type: BOOL
        payload:
            nHosts: CARD16
            pad1:   CARD16
            pad3:   CARD32
            pad4:   CARD32
            pad5:   CARD32
            pad6:   CARD32
            pad7:   CARD32
# ---------------------------------------------------------------------------
# core protocol opcodes (X11/Xproto.h, X_* defines)
# ---------------------------------------------------------------------------
opcode:
    CREATE_WINDOW: 1
    CHANGE_WINDOW_ATTRIBUTES: 2
    GET_WINDOW_ATTRIBUTES: 3
    DESTROY_WINDOW: 4
    DESTROY_SUBWINDOWS: 5
    CHANGE_SAVE_SET: 6
    REPARENT_WINDOW: 7
    MAP_WINDOW: 8
    MAP_SUBWINDOWS: 9
    UNMAP_WINDOW: 10
    UNMAP_SUBWINDOWS: 11
    CONFIGURE_WINDOW: 12
    CIRCULATE_WINDOW: 13
    GET_GEOMETRY: 14
    QUERY_TREE: 15
    INTERN_ATOM: 16
    GET_ATOM_NAME: 17
    CHANGE_PROPERTY: 18
    DELETE_PROPERTY: 19
    GET_PROPERTY: 20
    LIST_PROPERTIES: 21
    SET_SELECTION_OWNER: 22
    GET_SELECTION_OWNER: 23
    CONVERT_SELECTION: 24
    SEND_EVENT: 25
    GRAB_POINTER: 26
    UNGRAB_POINTER: 27
    GRAB_BUTTON: 28
    UNGRAB_BUTTON: 29
    CHANGE_ACTIVE_POINTER_GRAB: 30
    GRAB_KEYBOARD: 31
    UNGRAB_KEYBOARD: 32
    GRAB_KEY: 33
    UNGRAB_KEY: 34
    ALLOW_EVENTS: 35
    GRAB_SERVER: 36
    UNGRAB_SERVER: 37
    QUERY_POINTER: 38
    GET_MOTION_EVENTS: 39
    TRANSLATE_COORDS: 40
    WARP_POINTER: 41
    SET_INPUT_FOCUS: 42
    GET_INPUT_FOCUS: 43
    QUERY_KEYMAP: 44
    OPEN_FONT: 45
    CLOSE_FONT: 46
    QUERY_FONT: 47
    QUERY_TEXT_EXTENTS: 48
    LIST_FONTS: 49
    LIST_FONTS_WITH_INFO: 50
    SET_FONT_PATH: 51
    GET_FONT_PATH: 52
    CREATE_PIXMAP: 53
    FREE_PIXMAP: 54
    CREATE_GC: 55
    CHANGE_GC: 56
    COPY_GC: 57
    SET_DASHES: 58
    SET_CLIP_RECTANGLES: 59
    FREE_GC: 60
    CLEAR_AREA: 61
    COPY_AREA: 62
    COPY_PLANE: 63
    POLY_POINT: 64
    POLY_LINE: 65
    POLY_SEGMENT: 66
    POLY_RECTANGLE: 67
    POLY_ARC: 68
    FILL_POLY: 69
    POLY_FILL_RECTANGLE: 70
    POLY_FILL_ARC: 71
    PUT_IMAGE: 72
    GET_IMAGE: 73
    POLY_TEXT8: 74
    POLY_TEXT16: 75
    IMAGE_TEXT8: 76
    IMAGE_TEXT16: 77
    CREATE_COLORMAP: 78
    FREE_COLORMAP: 79
    COPY_COLORMAP_AND_FREE: 80
    INSTALL_COLORMAP: 81
    UNINSTALL_COLORMAP: 82
    LIST_INSTALLED_COLORMAPS: 83
    ALLOC_COLOR: 84
    ALLOC_NAMED_COLOR: 85
    ALLOC_COLOR_CELLS: 86
    ALLOC_COLOR_PLANES: 87
    FREE_COLORS: 88
    STORE_COLORS: 89
    STORE_NAMED_COLOR: 90
    QUERY_COLORS: 91
    LOOKUP_COLOR: 92
    CREATE_CURSOR: 93
    CREATE_GLYPH_CURSOR: 94
    FREE_CURSOR: 95
    RECOLOR_CURSOR: 96
    QUERY_BEST_SIZE: 97
    QUERY_EXTENSION: 98
    LIST_EXTENSIONS: 99
    CHANGE_KEYBOARD_MAPPING: 100
    GET_KEYBOARD_MAPPING: 101
    CHANGE_KEYBOARD_CONTROL: 102
    GET_KEYBOARD_CONTROL: 103
    BELL: 104
    CHANGE_POINTER_CONTROL: 105
    GET_POINTER_CONTROL: 106
    SET_SCREEN_SAVER: 107
    GET_SCREEN_SAVER: 108
    CHANGE_HOSTS: 109
    LIST_HOSTS: 110
    SET_ACCESS_CONTROL: 111
    SET_CLOSE_DOWN_MODE: 112
    KILL_CLIENT: 113
    ROTATE_PROPERTIES: 114
    FORCE_SCREEN_SAVER: 115
    SET_POINTER_MAPPING: 116
    GET_POINTER_MAPPING: 117
    SET_MODIFIER_MAPPING: 118
    GET_MODIFIER_MAPPING: 119
    NO_OPERATION: 127

# ---------------------------------------------------------------------------
# core protocol request structs (wire-exact, X11/Xproto.h x*Req)
# resource-id-only requests use the generic xResourceReq layout ("id")
# ---------------------------------------------------------------------------
request-struct:
    CreateWindow:
        data-name: depth
        payload:
            wid:       WINDOW
            parent:    WINDOW
            x:         INT16
            y:         INT16
            width:     CARD16
            height:    CARD16
            borderWidth: CARD16
            class:     CARD16
            visual:    VISUAL
            mask:      CARD32
    ChangeWindowAttributes:
        payload:
            window:    WINDOW
            valueMask: CARD32
    GetWindowAttributes:
        payload:
            id: CARD32
    DestroyWindow:
        payload:
            id: CARD32
    DestroySubwindows:
        payload:
            id: CARD32
    ChangeSaveSet:
        data-name: mode
        payload:
            window: WINDOW
    ReparentWindow:
        payload:
            window: WINDOW
            parent: WINDOW
            x:      INT16
            y:      INT16
    MapWindow:
        payload:
            id: CARD32
    MapSubwindows:
        payload:
            id: CARD32
    UnmapWindow:
        payload:
            id: CARD32
    UnmapSubwindows:
        payload:
            id: CARD32
    ConfigureWindow:
        payload:
            window: WINDOW
            mask:   CARD16
            pad2:   CARD16
    CirculateWindow:
        data-name: direction
        payload:
            window: WINDOW
    GetGeometry:
        payload:
            id: CARD32
    QueryTree:
        payload:
            id: CARD32
    InternAtom:
        data-name: onlyIfExists
        data-type: BOOL
        payload:
            nbytes: CARD16
            pad:    CARD16
    GetAtomName:
        payload:
            id: CARD32
    ChangeProperty:
        data-name: mode
        payload:
            window: WINDOW
            property: ATOM
            type:     ATOM
            format:   CARD8
            nUnits:   CARD32
    DeleteProperty:
        payload:
            window:   WINDOW
            property: ATOM
    GetProperty:
        data-name: delete
        data-type: BOOL
        payload:
            window:     WINDOW
            property:   ATOM
            type:       ATOM
            longOffset: CARD32
            longLength: CARD32
    ListProperties:
        payload:
            id: CARD32
    SetSelectionOwner:
        payload:
            window:    WINDOW
            selection: ATOM
            time:      TIME
    GetSelectionOwner:
        payload:
            id: CARD32
    ConvertSelection:
        payload:
            requestor: WINDOW
            selection: ATOM
            target:    ATOM
            property:  ATOM
            time:      TIME
    SendEvent:
        data-name: propagate
        data-type: BOOL
        payload:
            destination: WINDOW
            eventMask:   CARD32
            event:       BYTE_ARRAY_32
    GrabPointer:
        data-name: ownerEvents
        data-type: BOOL
        payload:
            grabWindow:   WINDOW
            eventMask:    CARD16
            pointerMode:  BYTE
            keyboardMode: BYTE
            confineTo:    WINDOW
            cursor:       CURSOR
            time:         TIME
    UngrabPointer:
        payload:
            id: CARD32
    GrabButton:
        data-name: ownerEvents
        data-type: BOOL
        payload:
            grabWindow:   WINDOW
            eventMask:    CARD16
            pointerMode:  BYTE
            keyboardMode: BYTE
            confineTo:    WINDOW
            cursor:       CURSOR
            button:       CARD8
            pad:          BYTE
            modifiers:    CARD16
    UngrabButton:
        data-name: button
        payload:
            grabWindow: WINDOW
            modifiers:  CARD16
            pad:        CARD16
    ChangeActivePointerGrab:
        payload:
            cursor:    CURSOR
            time:      TIME
            eventMask: CARD16
            pad2:      CARD16
    GrabKeyboard:
        data-name: ownerEvents
        data-type: BOOL
        payload:
            grabWindow:   WINDOW
            time:         TIME
            pointerMode:  BYTE
            keyboardMode: BYTE
            pad:          CARD16
    UngrabKeyboard:
        payload:
            id: CARD32
    GrabKey:
        data-name: ownerEvents
        data-type: BOOL
        payload:
            grabWindow:   WINDOW
            modifiers:    CARD16
            key:          CARD8
            pointerMode:  BYTE
            keyboardMode: BYTE
            pad1:         BYTE
            pad2:         BYTE
            pad3:         BYTE
    UngrabKey:
        data-name: key
        payload:
            grabWindow: WINDOW
            modifiers:  CARD16
            pad:        CARD16
    AllowEvents:
        data-name: mode
        payload:
            time: TIME
    GrabServer:
        payload: {}
    UngrabServer:
        payload: {}
    QueryPointer:
        payload:
            id: CARD32
    GetMotionEvents:
        payload:
            window: WINDOW
            start:  TIME
            stop:   TIME
    TranslateCoords:
        payload:
            srcWid: WINDOW
            dstWid: WINDOW
            srcX:   INT16
            srcY:   INT16
    WarpPointer:
        payload:
            srcWid:    WINDOW
            dstWid:    WINDOW
            srcX:      INT16
            srcY:      INT16
            srcWidth:  CARD16
            srcHeight: CARD16
            dstX:      INT16
            dstY:      INT16
    SetInputFocus:
        data-name: revertTo
        payload:
            focus: WINDOW
            time:  TIME
    GetInputFocus:
        payload: {}
    QueryKeymap:
        payload: {}
    OpenFont:
        payload:
            fid:    FONT
            nbytes: CARD16
            pad1:   BYTE
            pad2:   BYTE
    CloseFont:
        payload:
            id: CARD32
    QueryFont:
        payload:
            id: CARD32
    QueryTextExtents:
        data-name: oddLength
        data-type: BOOL
        payload:
            fid: FONT
    ListFonts:
        payload:
            maxNames: CARD16
            nbytes:   CARD16
    ListFontsWithInfo:
        payload:
            maxNames: CARD16
            nbytes:   CARD16
    SetFontPath:
        payload:
            nFonts: CARD16
            pad1:   BYTE
            pad2:   BYTE
    GetFontPath:
        payload: {}
    CreatePixmap:
        data-name: depth
        payload:
            pid:      PIXMAP
            drawable: DRAWABLE
            width:    CARD16
            height:   CARD16
    FreePixmap:
        payload:
            id: CARD32
    CreateGC:
        payload:
            gc:       GCONTEXT
            drawable: DRAWABLE
            mask:     CARD32
    ChangeGC:
        payload:
            gc:   GCONTEXT
            mask: CARD32
    CopyGC:
        payload:
            srcGC: GCONTEXT
            dstGC: GCONTEXT
            mask:  CARD32
    SetDashes:
        payload:
            gc:         GCONTEXT
            dashOffset: CARD16
            nDashes:    CARD16
    SetClipRectangles:
        data-name: ordering
        payload:
            gc:      GCONTEXT
            xOrigin: INT16
            yOrigin: INT16
    FreeGC:
        payload:
            id: CARD32
    ClearArea:
        data-name: exposures
        data-type: BOOL
        payload:
            window: WINDOW
            x:      INT16
            y:      INT16
            width:  CARD16
            height: CARD16
    CopyArea:
        payload:
            srcDrawable: DRAWABLE
            dstDrawable: DRAWABLE
            gc:          GCONTEXT
            srcX:        INT16
            srcY:        INT16
            dstX:        INT16
            dstY:        INT16
            width:       CARD16
            height:      CARD16
    CopyPlane:
        payload:
            srcDrawable: DRAWABLE
            dstDrawable: DRAWABLE
            gc:          GCONTEXT
            srcX:        INT16
            srcY:        INT16
            dstX:        INT16
            dstY:        INT16
            width:       CARD16
            height:      CARD16
            bitPlane:    CARD32
    PolyPoint:
        data-name: coordMode
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PolyLine:
        data-name: coordMode
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PolySegment:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PolyRectangle:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PolyArc:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    FillPoly:
        payload:
            drawable:  DRAWABLE
            gc:        GCONTEXT
            shape:     BYTE
            coordMode: BYTE
            pad1:      CARD16
    PolyFillRectangle:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PolyFillArc:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
    PutImage:
        data-name: format
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
            width:    CARD16
            height:   CARD16
            dstX:     INT16
            dstY:     INT16
            leftPad:  CARD8
            depth:    CARD8
            pad:      CARD16
    GetImage:
        data-name: format
        payload:
            drawable:  DRAWABLE
            x:         INT16
            y:         INT16
            width:     CARD16
            height:    CARD16
            planeMask: CARD32
    PolyText8:
        payload:
            drawable: DRAWABLE
            gc:       GCONTEXT
            x:        INT16
            y:        INT16
    PolyText16:
        payload:
            drawable: DRAWABLE
