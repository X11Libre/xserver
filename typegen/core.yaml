            state:  BYTE
            pad1:   BYTE
            pad2:   CARD16
    SelectionClear:
        payload:
            time:   TIME
            window: WINDOW
            atom:   ATOM
    SelectionRequest:
        payload:
            time:      TIME
            owner:     WINDOW
            requestor: WINDOW
            selection: ATOM
