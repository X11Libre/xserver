# ---------------------------------------------------------------------------
# core protocol events (wire-exact, X11/Xproto.h xEvent union)
# the 4-byte type/detail/sequenceNumber header doubles as the reference "pad00"
# ---------------------------------------------------------------------------
event:
    KeyButtonPointer:
        payload:
            time:       TIME
            root:       WINDOW
            event:      WINDOW
            child:      WINDOW
            rootX:      INT16
            rootY:      INT16
            eventX:     INT16
            eventY:     INT16
            state:      KEYBUTMASK
            sameScreen: BOOL
            pad1:       BYTE
    EnterLeave:
        payload:
            time:   TIME
            root:   WINDOW
            event:  WINDOW
            child:  WINDOW
            rootX:  INT16
            rootY:  INT16
            eventX: INT16
            eventY: INT16
            state:  KEYBUTMASK
            mode:   BYTE
            flags:  BYTE
    Focus:
        payload:
            window: WINDOW
            mode:   BYTE
            pad1:   BYTE
            pad2:   BYTE
            pad3:   BYTE
    Expose:
        payload:
            window: WINDOW
            x:      INT16
            y:      INT16
            width:  CARD16
            height: CARD16
            count:  CARD16
            pad2:   CARD16
    GraphicsExposure:
        payload:
            drawable:   DRAWABLE
            x:          INT16
            y:          INT16
            width:      CARD16
            height:     CARD16
            minorEvent: CARD16
            count:      CARD16
            majorEvent: BYTE
            pad1:       BYTE
            pad2:       BYTE
            pad3:       BYTE
    NoExposure:
        payload:
            drawable:   DRAWABLE
            minorEvent: CARD16
            majorEvent: BYTE
            bpad:       BYTE
    Visibility:
        payload:
            window: WINDOW
            state:  BYTE
            pad1:   BYTE
            pad2:   BYTE
            pad3:   BYTE
    CreateNotify:
        payload:
            parent:      WINDOW
            window:      WINDOW
            x:           INT16
            y:           INT16
            width:       CARD16
            height:      CARD16
            borderWidth: CARD16
            override:    BOOL
            bpad:        BYTE
    DestroyNotify:
        payload:
            event:  WINDOW
            window: WINDOW
    UnmapNotify:
        payload:
            event:         WINDOW
            window:        WINDOW
            fromConfigure: BOOL
            pad1:          BYTE
            pad2:          BYTE
            pad3:          BYTE
    MapNotify:
        payload:
            event:   WINDOW
            window:  WINDOW
            override: BOOL
            pad1:    BYTE
            pad2:    BYTE
            pad3:    BYTE
    MapRequest:
        payload:
            parent: WINDOW
            window: WINDOW
    Reparent:
        payload:
            event:   WINDOW
            window:  WINDOW
            parent:  WINDOW
            x:       INT16
            y:       INT16
            override: BOOL
            pad1:    BYTE
            pad2:    BYTE
            pad3:    BYTE
    ConfigureNotify:
        payload:
            event:        WINDOW
            window:       WINDOW
            aboveSibling: WINDOW
            x:            INT16
            y:            INT16
            width:        CARD16
            height:       CARD16
            borderWidth:  CARD16
            override:     BOOL
            bpad:         BYTE
    ConfigureRequest:
        payload:
            parent:       WINDOW
            window:       WINDOW
            sibling:      WINDOW
            x:            INT16
            y:            INT16
            width:        CARD16
            height:       CARD16
            borderWidth:  CARD16
            valueMask:    CARD16
            pad1:         CARD32
    Gravity:
        payload:
            event:  WINDOW
            window: WINDOW
            x:      INT16
            y:      INT16
            pad1:   CARD32
            pad2:   CARD32
            pad3:   CARD32
            pad4:   CARD32
